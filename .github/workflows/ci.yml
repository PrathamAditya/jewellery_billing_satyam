name: CI
# One check per wave, not one per spec. Spec PRs go into the wave branch (wave-N) and do not run CI.
# The single run happens on the pull request from the wave branch into main (and by hand from the Actions tab).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate -w @jewellery/api
